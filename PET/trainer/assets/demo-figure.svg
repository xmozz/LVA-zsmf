  <rect x="40" y="22" width="330" height="136" rx="4" fill="none" stroke="#5a5f66" stroke-width="2"/>
  <rect x="52" y="34" width="306" height="30" rx="2" fill="#e5ecfa" stroke="#2c5bc7"/>
  <rect x="52" y="72" width="306" height="30" rx="2" fill="#e5ecfa" stroke="#2c5bc7"/>
